<!DOCTYPE html>
<html> 
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Music is Universal</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <link rel="stylesheet" href="styles.css">
  </head>


  <body style="background-color: floralwhite;">

    <h1 class="header">
      Music Brings Us Together
    </h1>
  

<div class="split-container">
        
        <!-- LEFT SIDE - Spinning Record -->
        <div class="left-image">
            <div class="record">
                <img src="assets/earth record.png" alt="record">
            </div>
        </div>

<!-- BOTTOM - Music Buttons (horizontal row) -->
    <div class="music-buttons">
        
        <!-- Button 1 -->
        <label>
            <input type="radio" name="music" id="song1">
            <div class="button-wrapper">
                <span>Reggaeton</span>  <!-- ✅ Title above -->
                <img src="assets/endless butterfly.png" alt="Song 1">
            </div>
        </label>

        <!-- Button 2 -->
        <label>
            <input type="radio" name="music" id="song2">
            <div class="button-wrapper">
                <span>K-Pop</span>
                <img src="assets/endless flower (1).png" alt="Song 2">
            </div>
        </label>

        <!-- Button 3 -->
        <label>
            <input type="radio" name="music" id="song3">
            <div class="button-wrapper">
                <span>Aboriginal Hip-Hop</span>
                <img src="assets/endless PurpFlower.png" alt="Song 3">
            </div>
        </label>

        <!-- Button 4 -->
        <label>
            <input type="radio" name="music" id="song4">
            <div class="button-wrapper">
                <span>Reggae</span>
                <img src="assets/endless monster.png" alt="Song 4">
            </div>
        </label>
    </div>

    <!-- Audio Players (same as before) -->
    <div class="audio-player player1">
        <div class="now-playing">🎵 Now Playing: Song Title 1</div>
        <audio controls autoplay>
            <source src="assets/play button.png" type="audio/mpeg">
        </audio>
    </div>
    <!-- ... other audio players ... -->

</div>

    <div class="translate-icon">
        <a href="lastpage.html">Next Page ></a>
      </div>

  </body>
</html>
