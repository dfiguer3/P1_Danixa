<!DOCTYPE html>
<html> 
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Connect the Dots</title>
      <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <link rel="stylesheet" href="styles.css">
  </head>


<body background="floralwhite">
<section>
        <div class="container">
            <p style="margin-bottom: 30px; color: #6b7280;">Connect the dots in order from 1 to <span id="totalDots">20</span></p>
            
            <canvas id="gameCanvas" width="500" height="500"></canvas>
            
            <div class="progress">
                Progress: <span id="connectedCount">0</span> / <span id="totalCount">20</span> dots connected
            </div>
            
            <button class="reset-btn" id="resetBtn" style="display: none;">Reset</button>
        </div>
</section>

    <div class="completion-overlay" id="completionOverlay">
        <div class="completion-card">
            <div class="heart-icon">❤️</div>
            <h2 class="completion-title">Complete!</h2>
            <p class="completion-text">You've created a heart!</p>
            <button class="play-again-btn" id="playAgainBtn">Play Again</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const completionOverlay = document.getElementById('completionOverlay');
        const resetBtn = document.getElementById('resetBtn');
        const playAgainBtn = document.getElementById('playAgainBtn');
        const connectedCountEl = document.getElementById('connectedCount');
        const totalCountEl = document.getElementById('totalCount');
        const totalDotsEl = document.getElementById('totalDots');

        let dots = [];
        let connectedDots = [];
        let currentDot = null;
        let isComplete = false;

        // Generate heart-shaped dots with CORRECTED scale
        function generateHeartDots(numDots = 20) {
            const dotsArray = [];
            const centerX = 250;
            const centerY = 250;
    const scale = 50;

            for (let i = 0; i < numDots; i++) {
                const t = (i / numDots) * 2 * Math.PI;
                // Parametric heart equation
                const x = centerX + scale * 16 * Math.pow(Math.sin(t), 3);
                const y = centerY - scale * (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) / 16;
                
                dotsArray.push({ x, y, id: i + 1 });
            }
            return dotsArray;
        }

        function drawDots() {
            dots.forEach(dot => {
                const isConnected = connectedDots.includes(dot.id);
                const isNext = dot.id === currentDot + 1 || (connectedDots.length === 0 && dot.id === 1);

                // Draw dot
                ctx.beginPath();
                ctx.arc(dot.x, dot.y, isNext ? 12 : 8, 0, Math.PI * 2);
                
                if (isConnected) {
                    ctx.fillStyle = '#9B4F96';
                    ctx.strokeStyle = '#9ca3af';
                } else if (isNext) {
                    ctx.fillStyle = '#ec4899';
                    ctx.strokeStyle = '#9B4F96';
                    ctx.lineWidth = 3;
                } else {
                    ctx.fillStyle = '#e5e7eb';
                    ctx.strokeStyle = '#9ca3af';
                    ctx.lineWidth = 2;
                }
                
                ctx.fill();
                ctx.stroke();

                // Draw number
                ctx.fillStyle = 'white';
                ctx.font = 'bold 12px PPFrama-Regular, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(dot.id, dot.x, dot.y);
            });
        }

        function drawLines() {
            if (connectedDots.length < 2) return;

            ctx.strokeStyle = '#9B4F96';
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            ctx.beginPath();
            const firstDot = dots.find(d => d.id === connectedDots[0]);
            ctx.moveTo(firstDot.x, firstDot.y);

            for (let i = 1; i < connectedDots.length; i++) {
                const dot = dots.find(d => d.id === connectedDots[i]);
                ctx.lineTo(dot.x, dot.y);
            }
            ctx.stroke();
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawLines();
            drawDots();
        }

        function getDotAtPosition(x, y) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const clickX = (x - rect.left) * scaleX;
            const clickY = (y - rect.top) * scaleY;

            for (let dot of dots) {
                const distance = Math.sqrt(Math.pow(clickX - dot.x, 2) + Math.pow(clickY - dot.y, 2));
                if (distance <= 15) {
                    return dot;
                }
            }
            return null;
        }

        function handleDotClick(dotId) {
            if (isComplete) return;

            // Must connect dots in order
            if (connectedDots.length === 0 && dotId === 1) {
                connectedDots.push(dotId);
                currentDot = dotId;
            } else if (dotId === currentDot + 1) {
                connectedDots.push(dotId);
                currentDot = dotId;

                // Check if complete
                if (dotId === dots.length) {
                    setTimeout(() => {
                        isComplete = true;
                        completionOverlay.classList.add('show');
                    }, 300);
                }
            }

            connectedCountEl.textContent = connectedDots.length;
            
            if (connectedDots.length > 0) {
                resetBtn.style.display = 'block';
            }

            render();
        }

        function resetGame() {
            connectedDots = [];
            currentDot = null;
            isComplete = false;
            connectedCountEl.textContent = '0';
            resetBtn.style.display = 'none';
            completionOverlay.classList.remove('show');
            render();
        }

        // Event listeners
        canvas.addEventListener('click', (e) => {
            const dot = getDotAtPosition(e.clientX, e.clientY);
            if (dot) {
                handleDotClick(dot.id);
            }
        });

        // Touch support for mobile
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const dot = getDotAtPosition(touch.clientX, touch.clientY);
            if (dot) {
                handleDotClick(dot.id);
            }
        });

        resetBtn.addEventListener('click', resetGame);
        playAgainBtn.addEventListener('click', resetGame);

        // Initialize
        dots = generateHeartDots();
        totalCountEl.textContent = dots.length;
        totalDotsEl.textContent = dots.length;
        render();

        // Log dot positions for debugging
        console.log('Dot positions:', dots.map(d => `Dot ${d.id}: (${Math.round(d.x)}, ${Math.round(d.y)})`));
    </script>

    <div class="Button">
        <a href="page2.html">Next Page ></a>
    </div>


  </body>
</html>
